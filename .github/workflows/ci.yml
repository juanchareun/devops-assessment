name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsAssessment/DevOpsAssessment.csproj

      - name: Check formatting
        run: dotnet format DevOpsAssessment/DevOpsAssessment.csproj --verify-no-changes --no-restore

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsAssessment/DevOpsAssessment.csproj

      - name: Build
        run: dotnet build DevOpsAssessment/DevOpsAssessment.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test DevOpsAssessment/DevOpsAssessment.csproj --configuration Release --no-build
