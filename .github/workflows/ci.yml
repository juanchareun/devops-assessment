name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsAssessment/DevOpsAssessment.csproj

      - name: Check formatting
        run: dotnet format DevOpsAssessment/DevOpsAssessment.csproj --verify-no-changes --no-restore

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsAssessment/DevOpsAssessment.csproj

      - name: Build
        run: dotnet build DevOpsAssessment/DevOpsAssessment.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test DevOpsAssessment/DevOpsAssessment.csproj --configuration Release --no-build

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsAssessment/DevOpsAssessment.csproj

      - name: Scan NuGet dependencies
        run: dotnet list DevOpsAssessment/DevOpsAssessment.csproj package --vulnerable --include-transitive

  docker-build-and-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-assessment:${{ github.sha }} \
            ./DevOpsAssessment

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-assessment:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
